# ==============================================================================
# Application Configuration - Correspondances
# ==============================================================================

spring.application.name=Correspondances


# ==============================================================================
# PostgreSQL 16 Database Connection
# ==============================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/correspondances

spring.datasource.username=postgres

spring.datasource.password=postgrespassword

spring.datasource.driver-class-name=org.postgresql.Driver


# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway manages schema evolution; Hibernate only validates schema consistency
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


# ==============================================================================
# Flyway Migrations
# ==============================================================================

spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true

spring.flyway.locations=classpath:db/migration


# ==============================================================================
# Swagger / OpenAPI (SpringDoc)
# ==============================================================================

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operations-sorter=method

