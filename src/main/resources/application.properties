spring.application.name=Correspondances

# Configuration Base de données PostgreSQL 16
spring.datasource.url=jdbc:postgresql://localhost:5432/correspondances
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'validate' ou 'none' : c'est Flyway qui gère les tables, Hibernate ne touche à rien
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
