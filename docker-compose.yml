services:
  postgres:
    image: postgres:16-alpine
    container_name: correspondances-db
    environment:
      POSTGRES_DB: correspondances
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
